<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Places — Damiano Cerrone</title><meta name="description" content="Places — a catalogue of photographs by Damiano Cerrone."><link rel="canonical" href="https://damianocerrone.com/places.html"><meta name="author" content="Damiano Cerrone"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta property="og:type" content="website"><meta property="og:site_name" content="Damiano Cerrone"><meta property="og:locale" content="en_GB"><meta property="og:title" content="Places — Damiano Cerrone"><meta property="og:description" content="Places — a catalogue of photographs by Damiano Cerrone."><meta property="og:url" content="https://damianocerrone.com/places.html"><meta property="og:image" content="https://damianocerrone.com/assets/portrait-lead.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Places — Damiano Cerrone"><meta name="twitter:description" content="Places — a catalogue of photographs by Damiano Cerrone."><meta name="twitter:image" content="https://damianocerrone.com/assets/portrait-lead.jpg"><style>
:root{--paper:#17222E;--ink:#F4E3DA;--dim:#8791A1;--rule:#2A3D50;
 --accent:#F8B195;--accent2:#F67280;--hov:#6C5B7B;--hovink:#FBEDE6;
 --mono:ui-monospace,'SF Mono',Menlo,monospace;
 --sans:'Helvetica Neue',Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
/* margin:0 auto is load-bearing: without it the whole site hangs off the left
   edge on any wide screen, which reads as broken rather than as a choice. */
body{background:var(--paper);color:var(--ink);font:400 14px/1.55 var(--sans);
 -webkit-font-smoothing:antialiased;padding:30px 34px 84px;max-width:1060px;margin:0 auto}
a{color:inherit;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:baseline;
 padding-bottom:15px;margin-bottom:4px;border-bottom:1px solid var(--ink)}
.name{font-size:12px;letter-spacing:.17em;text-transform:uppercase;font-weight:600}
/* The nav is the site's spine — Damiano, 2026-08-04: make it prominent. Bigger,
   ink-bright not dim, wider gaps, and the current page carries an accent underline. */
nav{font-size:14px;color:var(--ink);letter-spacing:.005em;font-weight:500}
nav a{margin-left:26px;padding-bottom:3px;border-bottom:2px solid transparent;
 transition:color .15s,border-color .15s}
nav a.on{color:var(--accent);border-color:var(--accent)}
nav a:hover{color:var(--accent)}
.bio{font-size:clamp(19px,2.05vw,25px);line-height:1.52;letter-spacing:-.012em;
 margin:46px 0 18px;font-weight:400}
.bio .l{color:var(--accent);border-bottom:1px solid color-mix(in srgb,var(--accent) 38%,transparent);
 padding-bottom:1px;transition:border-color .14s,background .14s}
.bio .l:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.sig{font:10px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:50px}
.sig a{color:var(--accent2)}.sig a:hover{border-bottom:1px solid var(--accent2)}
.hd{font:10px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
 padding-bottom:7px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between}
.row{display:flex;align-items:baseline;gap:18px;padding:9px 8px 9px 0;
 border-bottom:1px solid var(--rule);margin-left:-8px;padding-left:8px;
 transition:background .08s,color .08s}
.row:hover{background:var(--hov);color:var(--hovink)}
.row:hover .to,.row:hover .yr{color:color-mix(in srgb,var(--hovink) 62%,transparent)}
.yr{font:11px var(--mono);color:var(--accent);flex:0 0 34px}
.ttl{flex:1;letter-spacing:-.005em}
.to{font:10px var(--mono);color:var(--dim);white-space:nowrap}
.row.inert{color:var(--dim)}.row.inert .yr{color:var(--dim)}
.row.inert:hover{background:transparent;color:var(--dim);cursor:default}
.more{display:inline-block;margin-top:22px;font:10px var(--mono);letter-spacing:.13em;
 text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--accent);padding-bottom:2px}
.note{font:10px var(--mono);color:var(--dim);line-height:1.7;margin-top:16px;
 border-left:2px solid var(--rule);padding-left:11px}
footer{margin-top:60px;padding-top:10px;border-top:1px solid var(--rule);display:flex;
 justify-content:space-between;font:10px var(--mono);color:var(--dim)}
h2{font:400 11px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
 margin:38px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
/* Visually hidden, still read by screen readers and search engines. The home and
   About heroes are a prose paragraph by design — making that long bio the H1 would
   be a bad heading, and having none at all left the two most important pages with
   no H1 (found in the 2026-08-04 SEO audit). This states the page's subject in the
   same words as its <title>, so it is a description, never cloaking. */
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
 clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
@media(max-width:640px){.to{display:none}body{padding:24px 20px 60px}
 .top{flex-direction:column;gap:12px;align-items:flex-start}
 nav{font-size:15px}nav a{margin:0 20px 0 0}}

.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:5px}
.cell{position:relative;aspect-ratio:4/3;overflow:hidden;background:#101a24;display:block;
 border:1px solid var(--rule);transition:border-color .2s}
.cell:hover{border-color:var(--accent)}
/* Resting state retuned against the real photographs. The study used bright
   report covers, so opacity .3 x brightness .42 still read; actual photographs
   are already dark and went to solid black. The name must still win, but the
   picture has to be visible enough to be worth pushing back. */
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
 opacity:.62;filter:grayscale(.75) brightness(.78);
 transition:opacity .45s,filter .45s,transform .8s cubic-bezier(.2,.7,.3,1)}
.cell:hover img{opacity:1;filter:grayscale(0) brightness(1);transform:scale(1.04)}
.cell b{position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end;
 padding:15px 16px;font-weight:400;font:400 clamp(18px,1.7vw,23px)/1.1 var(--sans);
 letter-spacing:-.02em;background:linear-gradient(transparent 35%,rgba(9,15,21,.7))}
.empty{border:1px dashed var(--rule);padding:26px 24px;margin-top:30px}
.empty h3{font:400 19px var(--sans);margin-bottom:10px}
.empty p{color:var(--dim);font-size:13.5px;line-height:1.7;max-width:64ch}
.empty code{font:11px var(--mono);color:var(--accent)}
/* entry: ONE photograph at a time, back and forth (Damiano, 2026-08-04) */
.pv-head{display:flex;align-items:baseline;gap:14px;margin:0 0 16px;flex-wrap:wrap}
.pv-yr{font:10px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.pv{position:relative;display:flex;align-items:center;justify-content:center;
 background:#0b131b;border:1px solid var(--rule);overflow:hidden}
.pv-img{display:block;max-width:100%;max-height:80vh;object-fit:contain;cursor:pointer;
 user-select:none;-webkit-user-select:none}
.pv-edge{position:absolute;top:0;bottom:0;width:26%;border:0;background:transparent;
 color:var(--hovink);font:300 42px/1 var(--sans);cursor:pointer;opacity:0;z-index:3;
 display:flex;align-items:center;transition:opacity .2s;-webkit-tap-highlight-color:transparent}
.pv-prev{left:0;justify-content:flex-start;padding-left:16px}
.pv-next{right:0;justify-content:flex-end;padding-right:16px}
.pv:hover .pv-edge{opacity:.45}.pv-edge:hover{opacity:1}
.pv-prev:hover{background:linear-gradient(90deg,rgba(9,15,21,.5),transparent)}
.pv-next:hover{background:linear-gradient(270deg,rgba(9,15,21,.5),transparent)}
.pv-bar{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:14px}
.pv-btn{background:none;border:1px solid var(--rule);color:var(--ink);font:10px var(--mono);
 letter-spacing:.11em;text-transform:uppercase;padding:9px 15px;cursor:pointer;transition:.15s}
.pv-btn:hover{border-color:var(--accent);color:var(--accent)}
.pv-count{font:11px var(--mono);letter-spacing:.16em;color:var(--dim);min-width:78px;text-align:center}
@media(max-width:560px){.pv-edge{opacity:.35;width:32%;font-size:32px}.pv-img{max-height:68vh}}
</style></head><body>

lt="San Diego landing" loading="lazy"><b>San Diego landing</b></a><a class="cell" href="place-tallinn-opening-to-the-seaside.html"><img src="assets/cover-tallinn-opening-to-the-seaside.jpg" alt="Tallinn opening to the seaside" loading="lazy"><b>Tallinn opening to the seaside</b></a></div>
