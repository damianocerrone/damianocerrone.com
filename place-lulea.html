<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lulea — Damiano Cerrone</title><style>
:root{--paper:#17222E;--ink:#F4E3DA;--dim:#8791A1;--rule:#2A3D50;
 --accent:#F8B195;--accent2:#F67280;--hov:#6C5B7B;--hovink:#FBEDE6;
 --mono:ui-monospace,'SF Mono',Menlo,monospace;
 --sans:'Helvetica Neue',Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
/* margin:0 auto is load-bearing: without it the whole site hangs off the left
   edge on any wide screen, which reads as broken rather than as a choice. */
body{background:var(--paper);color:var(--ink);font:400 14px/1.55 var(--sans);
 -webkit-font-smoothing:antialiased;padding:30px 34px 84px;max-width:1060px;margin:0 auto}
a{color:inherit;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:baseline;
 padding-bottom:10px;border-bottom:1px solid var(--ink)}
.name{font-size:11px;letter-spacing:.17em;text-transform:uppercase;font-weight:500}
nav{font-size:11px;color:var(--dim);letter-spacing:.03em}
nav a{margin-left:16px}nav a.on{color:var(--accent)}nav a:hover{color:var(--accent)}
.bio{font-size:clamp(19px,2.05vw,25px);line-height:1.52;letter-spacing:-.012em;
 margin:46px 0 18px;font-weight:400}
.bio .l{color:var(--accent);border-bottom:1px solid color-mix(in srgb,var(--accent) 38%,transparent);
 padding-bottom:1px;transition:border-color .14s,background .14s}
.bio .l:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.sig{font:10px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:50px}
.sig a{color:var(--accent2)}.sig a:hover{border-bottom:1px solid var(--accent2)}
.hd{font:10px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
 padding-bottom:7px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between}
.row{display:flex;align-items:baseline;gap:18px;padding:9px 8px 9px 0;
 border-bottom:1px solid var(--rule);margin-left:-8px;padding-left:8px;
 transition:background .08s,color .08s}
.row:hover{background:var(--hov);color:var(--hovink)}
.row:hover .to,.row:hover .yr{color:color-mix(in srgb,var(--hovink) 62%,transparent)}
.yr{font:11px var(--mono);color:var(--accent);flex:0 0 34px}
.ttl{flex:1;letter-spacing:-.005em}
.to{font:10px var(--mono);color:var(--dim);white-space:nowrap}
.row.inert{color:var(--dim)}.row.inert .yr{color:var(--dim)}
.row.inert:hover{background:transparent;color:var(--dim);cursor:default}
.more{display:inline-block;margin-top:22px;font:10px var(--mono);letter-spacing:.13em;
 text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--accent);padding-bottom:2px}
.note{font:10px var(--mono);color:var(--dim);line-height:1.7;margin-top:16px;
 border-left:2px solid var(--rule);padding-left:11px}
footer{margin-top:60px;padding-top:10px;border-top:1px solid var(--rule);display:flex;
 justify-content:space-between;font:10px var(--mono);color:var(--dim)}
h2{font:400 11px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
 margin:38px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
@media(max-width:640px){.to{display:none}body{padding:24px 20px 60px}
 .top{flex-direction:column;gap:10px;align-items:flex-start}nav a{margin:0 14px 0 0}}

.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:5px}
.cell{position:relative;aspect-ratio:4/3;overflow:hidden;background:#101a24;display:block;
 border:1px solid var(--rule);transition:border-color .2s}
.cell:hover{border-color:var(--accent)}
/* Resting state retuned against the real photographs. The study used bright
   report covers, so opacity .3 x brightness .42 still read; actual photographs
   are already dark and went to solid black. The name must still win, but the
   picture has to be visible enough to be worth pushing back. */
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
 opacity:.62;filter:grayscale(.75) brightness(.78);
 transition:opacity .45s,filter .45s,transform .8s cubic-bezier(.2,.7,.3,1)}
.cell:hover img{opacity:1;filter:grayscale(0) brightness(1);transform:scale(1.04)}
.cell b{position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end;
 padding:15px 16px;font-weight:400;font:400 clamp(18px,1.7vw,23px)/1.1 var(--sans);
 letter-spacing:-.02em;background:linear-gradient(transparent 35%,rgba(9,15,21,.7))}
.empty{border:1px dashed var(--rule);padding:26px 24px;margin-top:30px}
.empty h3{font:400 19px var(--sans);margin-bottom:10px}
.empty p{color:var(--dim);font-size:13.5px;line-height:1.7;max-width:64ch}
.empty code{font:11px var(--mono);color:var(--accent)}
/* entry: the contact sheet — every fourth tile doubled for rhythm */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
 grid-auto-flow:dense;gap:4px}
.sh{position:relative;aspect-ratio:1;overflow:hidden;background:#101a24;display:block}
.sh.big{grid-column:span 2;grid-row:span 2}
.sh img{width:100%;height:100%;object-fit:cover;filter:grayscale(.4) brightness(.8);
 transition:filter .35s,transform .7s cubic-bezier(.2,.7,.3,1)}
.sh:hover img{filter:none;transform:scale(1.04)}
.sh i{position:absolute;right:10px;bottom:8px;font:10px var(--mono);font-style:normal;
 color:var(--accent);opacity:0;transition:opacity .2s;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.sh:hover i{opacity:1}
@media(max-width:560px){.sh.big{grid-column:span 1;grid-row:span 1}}
</style></head><body>
